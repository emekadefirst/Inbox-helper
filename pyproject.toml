[project]
name = "inbox-helper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aerich>=0.10.1",
    "fastapi[latest]>=0.143.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.4",
    "python-slugify>=9.1.3",
    "tortoise-orm[asyncpg,asynpg]>=1.1.8",
    "tzdata>=2026.5",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src",
]
