[project]
name = "inbox-helper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "httpx>=0.28.1",
    "langchain>=1.4.6",
    "langchain-anthropic>=1.7.6",
    "openpyxl>=3.1.5",
    "pydantic[email]>=2.14.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.20",
    "tortoise-orm[asyncpg]>=1.1.8",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
dev = "src.scripts.server:dev"
start = "src.scripts.server:main"
mount = "src.scripts.aerich:mount"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src",
]

[tool.tortoise]
tortoise_orm = "src.core.database.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."
